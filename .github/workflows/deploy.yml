# Build and publish to GitHub Pages.
#
# Triggers:
# - push to main (human commits)
# - workflow_run (data commits: pushes made with GITHUB_TOKEN by the update
#   workflows do NOT fire `push` events — GitHub prevents workflow loops —
#   so we listen for those workflows finishing instead)
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Update race data', 'Update news']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # For workflow_run triggers, only deploy after a successful data update.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # workflow_run checks out the default branch tip, incl. fresh data commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
