# Weekly race-data refresh: results Monday morning after a race weekend,
# then highlight lookups for any new races (needs YOUTUBE_API_KEY secret;
# skipped gracefully if unset). Committing data/ triggers a site redeploy
# via deploy.yml's workflow_run trigger.
name: Update race data

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Pull latest results from Jolpica
        run: python scripts/update_results.py

      - name: Find official highlights for new races
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            python scripts/update_highlights.py
          else
            echo "YOUTUBE_API_KEY secret not set - skipping highlights."
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scheduled results/highlights update"
            git push
          fi
